# jcas60 自己的取舍（铁律 1）。关于外部世界的数不在这里：它们在 vendored 的 spec_sources
# （src/jcas60/vendor/spec_sources/data/*.yaml），mmw60_trx 的预设取舍在它自己的表里
# （src/jcas60/vendor/mmw60/data/spec/survey.yaml），jcas60.sources 把三张表合起来按键读，
# 同一个键出现两次直接报错。
#
# 这张表只有一种标签：本库自己定的数。每条的 note 写两件事——为什么这样取、换了会动什么。
# 示例 00 的末尾把这张表整份打印出来；tests/test_sources.py 按 grep 计数核对标签，
# 所以文件头与各字段的文字里不写“标签词 + 冒号”的字串。

entries:

  # ------------------------------------------------------------ 前端：三行共用的数里本库定的两个
  jcas60.antenna_gain_dbi:
    value: {tx: 10.0, rx: 10.0}
    unit: "dBi, dBi"
    source: assumed
    cite: "本库；等于 fmcw_radar 默认配置的占位值（它的报告 inputs.tx_gain_dbi / rx_gain_dbi）"
    note: "收、发天线增益。A 行的数直接取 fmcw_radar 的报告，它用的是 10 dBi（它自己的占位），三行共用一套前端数字（铁律 2），所以 B、C 也取 10 dBi，测试核对与报告的输入相等。换了会动什么：每 1 dB 发射增益动三行的 EIRP 1 dB（已顶到法规上限的行不动 EIRP，改动回退），每 1 dB 接收增益动三行的 SNR 1 dB；A 行不再等于 fmcw_radar 的现成报告，得用它的工具带覆盖值重出一份。mmw60_trx 的通信前端预设是 2 dBi（封装内天线），示例 00 §8 有这一档的灵敏度行。"

  jcas60.rx_gain_db:
    value: 40.0
    unit: dB
    source: assumed
    cite: "本库；等于 fmcw_radar 默认配置的接收增益档（它的报告 inputs.rx_gain_db）"
    note: "接收机增益档。它决定带内 P1dB 取雷达芯片手册 Figure 7-2 的哪一点（40 dB 档 −34 dBm）。换了会动什么：单站感知的压缩判据——每降 1 dB 增益，带内 P1dB 高 1 dB，需要的隔离度少 1 dB；图上最低的 30 dB 档 NF 从 11.0 升到 15.6 dB（示例 00 §5 给每一档）。SNR 不随它动：三行的 NF 都取手册表里的典型值。"

  # ------------------------------------------------------------ ay 感知波形
  jcas60.channel:
    value: {number: 2, width_hz: 2.16e+9}
    unit: "-, Hz"
    source: assumed
    cite: "本库；信道 2 是 mmw60_trx 的 ay 预设所在的信道，宽度是 ieee80211ay.channel_centres_ghz 相邻两项之差"
    note: "B、C 两行用的 EDMG 信道，以及法规检查里占用频带的算法：按整个 2.16 GHz 信道算（59.40–61.56 GHz），不按 1.76 GHz 的码片率算。换了会动什么：按雷达限值读时落在哪一档——信道 2 的上沿正好是 57–61.56 GHz 档的上沿，带关断时间可到 20 dBm；信道 1（57.24–59.40 GHz）还落进 57–59.4 GHz 档（室内 20 dBm，无关断要求）；信道 3（61.56–63.72 GHz）是 57–64 GHz 档的 14 dBm，信道 4 及以上跨出 64 GHz，只剩默认的 10 dBm。按通信限值读时不动。波长随信道变，SNR 动不到 0.1 dB。"

  jcas60.sensing_field:
    value: "L-CEF：Gu512 与 Gv512 各做一次循环相关再相加；L-STF 不参与相关"
    unit: text
    source: assumed
    cite: "本库；序列与拼法是 dmg.golay_sequences、dmg.cef_golay_layout"
    note: "拿包里的哪一段做感知。取 L-CEF 是因为每个单载波包都有它，拼法有公开出处，且 Gu512、Gv512 各自前面的 128 码片正好是循环前缀，128 码片以内的时延上互补旁瓣严格为零。L-STF 不用：它的组成公开材料里没有（spec_sources 的 ROADMAP），只知道末段是 −Ga128。802.11bf 实际用哪一段还没有条目（spec_sources#54）。换了会动什么：处理增益——把 L-STF 的 2176 码片也用上是 10·log10((2176 + 1024) / 1024) = +4.95 dB；改用 TRN 字段则由 TRN 的个数定。"

  jcas60.sensing_packet:
    value: {fields: [l_stf_chips, l_cef_chips, l_header_chips, edmg_header_a_chips], data_blocks: 0, trn_units: 0}
    unit: "edmg.sc_siso_preamble 的字段名, 块, 单元"
    source: assumed
    cite: "本库；各段长度是 edmg.sc_siso_preamble"
    note: "一个专门的感知包由哪些段组成：单信道、单流 EDMG SC 包的前导与两个头，不带数据、不带 TRN，是能发出来的最短的包。换了会动什么：只动占用的空口时间（每个包 5376 码片 = 3.05 µs），不动 SNR（只有 L-CEF 参与相关）。感知若搭在本来就要发的数据包上，额外的空口时间是零，但包的间隔就由业务定，不再均匀。"

  jcas60.trn_sensing:
    value: {units: 4, correlated_blocks: [2, 3, 4, 5], packet: "TRN-R，数据域为空", rotation_origin: "接着包的第一个码片数"}
    unit: "TRN 单元, 子字段里的段号, text, text"
    source: assumed
    cite: "本库；TRN 场的组成是 edmg.trn_field（基本子字段、TRN_BL、TRN-R 包每单元的子字段数、第 1 流的 Golay 对、旋转）；单站可在 TRN 场上感知、TRN 包型不限定是 ieee80211bf.dmg_monostatic_ppdu"
    note: "用 TRN 场做感知的那几行怎么建。包 = 同一个最短的 SC 包后面接一个 EDMG TRN-R 的 TRN 场（每单元的子字段数取条目的数），取 4 个单元：这是通信限值下 SNR 不低于 A 行的最小单元数（3 个单元 42.50 dB，4 个 43.75 dB，A 行 43.34 dB）。相关只用每个子字段的第 2–5 段：相邻段的互相关按符号两两抵消，128 码片以内旁瓣严格为零；第 1、6 段当保护，不参与（六段全用旁瓣 −36.4 dB，示例 00 §7）。Golay 对与 π/2 旋转不再是本库的取舍：spec_sources#57 之后 edmg.trn_field 写明第 1 流用 DMG 的 Ga128 / Gb128、序列用旋转 π/2-BPSK 发。剩下本库自己取的三处：包型取 TRN-R（条目说采纳的文本没有限定）；数据域为空（单纯的单站原文没有规定，协调单站要有 PSDU，本库不建）；旋转从包的第一个码片数起（条目写原文没说；TRN 场之前是 5376 = 4 × 1344 码片，从场的第一个码片数结果相同）。换了会动什么：单元数每 ×2 是 +3.01 dB 的 SNR、TRN 场的空口时间 ×2；把第 1、6 段也用上是 +1.76 dB，但旁瓣不再为零；带上数据域则每包多出它的长度，空口时间跟着长。"

  jcas60.sensing_burst:
    value: {n_packets: 64, interval_s: 1.0e-4, frames_per_s: 30.0}
    unit: "包, s, 帧/s"
    source: assumed
    cite: "本库；等于 fmcw_radar 默认配置的慢时间（64 个 chirp、周期 100 µs、每秒 30 帧）"
    note: "一次感知（一帧）发多少个感知包、间隔多少、每秒几帧。取成与 A 行相同，速度分辨率与不模糊速度因此只差波长（60.48 对 60 GHz）。换了会动什么：包数 ×2 则处理增益 +3 dB、速度分辨率细一倍、空口时间 ×2；间隔 ×2 则不模糊速度减半、速度分辨率细一倍；帧率只动空口时间与雷达读法下的关断余量。"

  jcas60.packet_overhead:
    value: {sifs_per_packet: 1}
    unit: "个 SIFS"
    source: assumed
    cite: "本库；SIFS 是 dmg.phy_timing#sifs_s"
    note: "每个感知包除了自己的时长，再算一个 SIFS 的空口时间（包前后通信不能紧贴着发）。换了会动什么：按通信限值读时的空口占比——不算间隔是 0.59 %，算一个 SIFS 是 1.16 %。"

  jcas60.doppler_window:
    value: hann
    unit: text
    source: assumed
    cite: "本库；等于 fmcw_radar 默认配置的多普勒窗"
    note: "慢时间（包与包之间）FFT 的窗，取成与 A 行相同。换了会动什么：矩形窗 SNR 高 1.76 dB、速度分辨率细到 0.89 / 1.44 倍，多普勒旁瓣从 −31.5 dB 升到 −13.3 dB（静止的泄漏会从零多普勒漏进目标所在的行）。快时间不加窗：相关接收的距离响应就是成形脉冲的自相关。"

  jcas60.adc:
    value: {samples_per_chip: 2, desense_allowed_db: 1.0}
    unit: "样点/码片, dB"
    source: assumed
    cite: "本库；ENOB 随采样率的模型与满量程余量取 mmw60_trx 的 assumed.converter_*"
    note: "相关接收机的 ADC 每个码片采两点（3.52 GS/s，I、Q 各一路），波形级仿真也跑在这个速率上；量化噪声、泄漏的相噪残余各自最多把热噪声底抬高 1 dB，才算“不压低灵敏度”。换了会动什么：每码片 3 点则带内量化噪声再低 1.76 dB、但 ENOB 模型少 0.29 bit（合计几乎不动）；允许抬高 3 dB 则两项判据各松 5.9 dB。"

  jcas60.rx_rapp_p:
    value: 2.0
    unit: "-"
    source: assumed
    cite: "本库；等于 fmcw_radar 的占位值（它的 sources.yaml：60g_sensing.rx_rapp_p），模型是它的 link/compression.py"
    note: "接收机压缩的模型：一个无记忆的 Rapp 限幅器作用在复包络上，1 dB 压缩点取带内 P1dB，p 是膝部的平滑度。没有读到任何接收机的 AM/AM 形状，p = 2 是 fmcw_radar 的占位。换了会动什么：p 越大越接近硬限幅，同一个 1 dB 点下弱信号的 SNR 掉得越晚越陡；SNR 掉 1 dB 所需的隔离度随 p 变（示例 00 §5 给 p = 1 / 3 的闭式数）。无记忆模型不含 AM/PM 与记忆效应，泄漏把回波调制到别的距离上的量只是下限。"

  jcas60.leakage_delay_s:
    value: 1.0e-10
    unit: s
    source: assumed
    cite: "本库"
    note: "单站时发射泄漏到接收的路径时延：0.1 ns（约 3 cm 的片上 / 板上耦合路径）。换了会动什么：泄漏的本振相噪残余按时延的平方涨（共用本振时相噪相关抵消，残余 ∝ sin²(πfτ)）——0.2 ns 时需要的隔离度多 5.5 dB、0.05 ns 时少 5.9 dB（低频偏按时延平方走，远频偏处 sin² 已经饱和）；泄漏落在哪个时延格上也跟着动（0.1 ns 是 0.18 码片）。天线反射或罩子反射的路径更长，不在这一条里。"

  jcas60.lo_phase_noise:
    value: "tgad_em.pn_params 的单极点单零点模型，每台设备一个本振"
    unit: text
    source: assumed
    cite: "本库；模型是 tgad_em.pn_model_shape / tgad_em.pn_params"
    note: "B、C 两行的本振相噪取 TGad 评估方法学的模型（PSD0 −90 dBc/Hz，1 MHz 处 −93 dBc/Hz，与雷达芯片手册 1 MHz 处的数同量级）。单站收发共用一个本振，双站两台各一个、互不相关。A 行的本振是 fmcw_radar 自己的 ADPLL（要出 chirp，换不成固定本振）：这是三行里唯一不是同一个数的前端量，对照表里标明。换了会动什么：单站泄漏的相噪残余与双站直达径的相噪逐 dB 跟着 PSD 动；热噪声限的 SNR 不动。"

  # ------------------------------------------------------------ 目标与检测
  jcas60.target:
    value: {range_m: 5.0, velocity_mps: 2.0}
    unit: "m, m/s"
    source: assumed
    cite: "本库；等于 fmcw_radar 默认配置的目标（它的报告 target.range_m / velocity_mps）；RCS 是 target_rcs.deep2019_pedestrian_77g#co_pol_min_dbsm"
    note: "对照表的目标：5 m 处远离的人体，径向速度 2 m/s。RCS 取行人仿真范围的下端 −10 dBsm（77 GHz 的射线追踪，不是 60 GHz 实测）。换了会动什么：距离进 R⁴，每 ×2 是 −12 dB；速度只动目标落在哪个多普勒格与 Golay 旁瓣（示例 00 §7）。"

  jcas60.detection:
    value: {pd: 0.9}
    unit: "-"
    source: assumed
    cite: "本库；虚警概率取 fmcw_radar 报告的 detection.pfa；所需的格点 SNR：A 行取报告的 detection.range_at_pd.snr_required_db，ay 各行用 vendored 的 cfarstats 在自己的图上算"
    note: "“能探测到的最远距离”按检测概率 0.9 算，三行同一条判据：各自那张图上 CA-CFAR（保护 2 格、训练 8 格，jcas60.sim）在这个 Pd 下要的格点 SNR，含门限自身的起伏与目标漏进训练格。A 行直接读报告（12.24 dB，比噪声电平已知的 11.75 dB 高 0.49 dB：Hann 窗加 4 倍补零让训练格只剩 33 个独立的）；ay 各行 11.81 dB（高 0.06 dB：只有多普勒窗让相邻格相关，码片间隔的时延格彼此独立）。2026-11-26 之前 ay 各行借的是 A 行的 12.24 dB。换了会动什么：换成噪声电平已知的门限（11.75 dB）ay 各行的距离远 0.3 %、A 行远 2.8 %；Pd 取 0.5 时已知噪声电平的门限再低 2.35 dB（9.40 dB）；保护格、训练格数换了两边的损失都变。"

  jcas60.cfar_monte_carlo:
    value: {maps: 200, range_cells: 512, target_spacing_cells: 32, seed: 1}
    unit: "张, 格, 格, -"
    source: assumed
    cite: "本库"
    note: "ay 各行检测判据的第二条路（jcas60.table.cfar_check）：在与 ay 的图同形的噪声图上真跑 CA-CFAR，数虚警；在同一份噪声上按所需 SNR 放稳定目标，数检出。图取 64 × range_cells 格，目标每隔 target_spacing_cells 格放一个（大于训练窗，互不进对方的训练格）。换了会动什么：只动统计误差（maps = 200 时虚警率 ±5 %、Pd ±0.004），不动表里任何一行的数。"

  jcas60.bistatic_geometry:
    value: {r_tx_m: 5.0, r_rx_m: 5.0, baseline_m: 5.0}
    unit: "m, m, m"
    source: assumed
    cite: "本库"
    note: "双站（C 行）的几何：发、收两台设备与目标成等边三角形，目标离两台都是 5 m，双站角 60°；目标沿双站角平分线远离；双站 RCS 取单站的条目；直达径上两副天线按满增益算（对动态范围是最坏情况）。换了会动什么：基线越短越接近单站（距离分辨率 ∝ 1 / cos(β/2)，60° 时粗 15 %），直达径也越强（基线减半 +6 dB）；目标不在平分线上运动时多普勒再乘它与平分线夹角的余弦。"

  # ------------------------------------------------------------ 空口时间的算法
  jcas60.fmcw_airtime:
    value: "FMCW 一帧的 chirp 串期间，这套前端不能通信"
    unit: text
    source: assumed
    cite: "本库"
    note: "A 行折算通信吞吐损失的算法：同一套前端要么出 chirp 要么发通信波形，一帧的 6.4 ms 整段算感知占用。换了会动什么：若雷达另有一套前端，占比是零，但那就不是“同一套前端”了。"

  jcas60.radar_reading_airtime:
    value: {lower: "关断时间只管感知的发射：与按通信限值读时同一个占比", upper: "关断时间管这台设备的全部发射：任意 33 ms 里至少关断规定的时长"}
    unit: text
    source: assumed
    cite: "本库；关断时间的数是 fcc15255.radar_* 条目"
    note: "按雷达限值读时感知占掉多少通信时间，原文没有说（spec_sources#54 第二组第 3 问），所以给上下两个界。换了会动什么：下界与通信读法相同（约 1 %）；上界是关断要求占窗口的比例（57–61.56 GHz 档 16.5 / 33 = 50 %）。"

  jcas60.comm_limit_kind:
    value: average
    unit: text
    source: assumed
    cite: "本库；限值是 fcc15255.eirp_avg_dbm / fcc15255.eirp_peak_dbm"
    note: "按通信限值读时用平均 EIRP 40 dBm 这一条：感知场是 π/2-BPSK，成形后峰均比不到 3 dB（mmw60_trx 示例 15 §2），平均值顶到 40 dBm 时峰值不到 43 dBm。换了会动什么：单天线时都不起作用——这套前端满功率只有 22 dBm EIRP，离 40 dBm 还差 18 dB。"

  # ------------------------------------------------------------ 波形级仿真的做法
  jcas60.sim:
    value: {seed: 1, frames_averaged: 8, buffer_chips: 2048, exclude_doppler_bins: 4, ridge_doppler_bins: 2, exclude_range_lags: 8, cfar_guard: 2, cfar_train: 8, compression_span_db: 12, compression_step_db: 2}
    unit: "-, 帧, 码片, 格, 格, 格, 格, 格, dB, dB"
    source: assumed
    cite: "本库；CFAR 的保护格与训练格等于 fmcw_radar 默认配置"
    note: "波形级仿真的数值设置：随机种子、SNR 取几帧的平均（峰上的噪声起伏每帧约 ±0.2 dB）、每个包的缓冲长度、读噪底时绕开峰的格数（距离上同一个数也用来绕开强径所在的时延，并让噪底只读到干净窗的远端以内这么多码片：再远相关窗滑出发射场，接收机在那里的行为不是它对回波的行为）、找峰时离零多普勒至少几格（静止径在多普勒窗主瓣里的那几格：Hann 是 ±2）、扫压缩时泄漏电平在带内 P1dB 上下各扫多宽、步长多少。换了会动什么：只动读数的统计起伏（8 帧平均后约 ±0.1 dB），不动期望值——除了 exclude_range_lags 取 0：深压缩下噪底读进窗外的时延，高 0.4 dB；缓冲短于场长加最大时延时结果是错的（代码里检查）。"

  jcas60.studies:
    value: {frames: 4, analog_samples_per_chip: [2, 4, 8], knee_rate: 4, knees: [1, 2, 3], level_offsets_db: [-3, -1, 1, 3], beyond_buffer_chips: 4096, beyond_delays_chips: [58, 128, 160, 192, 256, 314, 384, 512, 640, 768, 826], window_ranges_m: [2, 5, 8, 10], floor_margin_chips: 8, fast_velocities_mps: [50, 200], adc_delays: 16, adc_delay_step_chips: 1.37, adc_dither_lsb: [0.25, 0.5], leak_delays_s: [1.0e-10, 2.0e-10, 5.0e-10, 1.0e-9], reflector_range_m: 0.02, reflector_level_db: -10, cfo_hz: [5.0e+3, 5.0e+4, 2.42e+6], mask_offsets_chips: [1.5, 2.5, 3.5, 5, 8], scan_step_chip: 0.0625, doppler_offsets_bins: [2, 4, 8, 16], clutter_over_target_db: 40, clutter_range_m: 3, knee_point_over_p1db_db: 3, long_delays_chips: [128, 256, 314, 384, 512, 640, 768, 1024, 1280, 1536, 1600]}
    unit: "帧, 采样/码片, 采样/码片, -, dB, 码片, 码片, m, 码片, m/s, -, 码片, LSB, s, m, dB, Hz, 码片, 码片, 格, dB, m, dB, 码片"
    source: assumed
    cite: "本库；ROADMAP“没有做的”各条的研究（jcas60.studies，示例 01）；近处反射体的两个数与 fmcw_radar 的 configs/radar_60g_mimo.yaml 相同"
    note: "对照表之外的几项研究怎么扫。frames：每个读数平均几帧（同一组噪声下比“带限幅器”与“不带”，4 帧够）。analog_samples_per_chip：限幅器之前的模拟部分按每码片几个采样算（2 就是 ADC 自己的速率；往上是在问连续时间的限幅器是多少）；knee_rate：扫膝部时用哪个速率；knees：Rapp 的 p 取哪几个（1 软、3 硬，2 是 fmcw_radar 的占位值）；level_offsets_db：在闭式给的电平上下各取几点让仿真找“SNR 掉 1 dB”的交点。beyond_delays_chips：窗外的目标放在哪些时延上（58 是 5 m，314 = 58 + 256、826 = 58 + 768 是它多出两段、六段的位置）；beyond_buffer_chips：为此把 L-CEF 的缓冲加长到多少；window_ranges_m：窗内核两条路的几个距离；floor_margin_chips：找假峰时离窗的远端留几个码片。fast_velocities_mps：包内相干损失在目标速度与不模糊速度之外再看哪两个速度。adc_delays / adc_delay_step_chips：ADC 抖不开时把目标放在多少个时延上、相邻差多少码片（取非整数让采样相位也跟着变）；adc_dither_lsb：试哪几个抖动量（每路的高斯噪声 rms，加在量化之前、不减回去）。leak_delays_s：泄漏的时延扫哪几个；reflector_range_m / reflector_level_db：近处反射体离天线多远、比直接泄漏低多少（取 fmcw_radar 的 radar_60g_mimo.yaml 里那一个：2 cm、−10 dB，它也是假设）。cfo_hz：双站两台设备之间留下的载波频偏试哪几个——5 kHz 是 mmw60_trx 说它的 STF 估计残差的上限（它的铁律 3，没有成条目的数），50 kHz 是差十倍的估计，2.42 MHz 是两边各 ±20 ppm 在 60.48 GHz 上完全不补偿（±20 ppm 是 802.11ad 的容差，spec_sources 没有这一条，这里当假设）。mask_offsets_chips：强目标在距它多少码片处留下的电平要读（各取 ±半码片内的最大值，不读单格）；scan_step_chip：量距离响应时目标每次挪多少；doppler_offsets_bins：慢时间上离强目标多少格以外取包络；clutter_over_target_db / clutter_range_m：静止杂波比目标强多少、放在多远（一面墙或一件家具的量级，没有出处）。换了会动什么：只是多扫或少扫几个点；速率取到 4 以上判据不再动（示例 01 §1），帧数只动读数的起伏。knee_point_over_p1db_db：拟合膝部的另一条路取 1 dB 点以上几 dB 处的那一个点（spec_sources#59 的答复用的是 3 dB）。long_delays_chips：TRN_BL = 256 的场上窗外目标放在哪些时延（到折回的 1536 码片以外）。"

  jcas60.sensing_waveform:
    value: {pattern: ["+Ga_N", "+Gb_N", "+Ga_N", "-Gb_N", "+Ga_N", "+Gb_N", "-Ga_N", "+Gb_N"], guard_blocks: 4, clean_blocks: 2}
    unit: "sequences, 段, 段"
    source: assumed
    cite: "本库；条目 ieee80211bf.dmg_monostatic_ppdu 允许单站在 TRN 场里放满足四个条件的任意波形；序列是 dmg.golay_sequences 的 Ga128 / Gb128"
    note: "为感知设计的 TRN 场波形（示例 01 §11）：整场 Ga128 / Gb128 交替，符号以 8 段为周期。偶数段的符号 [+ + + −] 是长 4 的完美二元序列（周期自相关在非零移位上为零），奇数段的符号是它移 2 位 [+ − + +]：相邻段的互相关按符号抵消，所以每一段都能相关；时延差在 clean_blocks 段（256 码片）以内旁瓣严格为零——干净区是标准子字段的两倍（示例 01 §11 用码片的相关核过，两侧都是）。两端各留 guard_blocks 段不相关：被相关的是整 29 个周期，两头各 4 段当保护（少于整周期时相邻段的互相关抵不干净，保护取 1 段时旁瓣从舍入界升到 −58 dB）。场长与标准 TRN 场相同（jcas60.trn_sensing 的单元数）。换了会动什么：换成别的符号图样，干净区缩回一段或窗外重新出离散的假峰（标准子字段在多出 2 段处是 −6.1 dB）；周期取 8 段时整个折回在 1024 码片 = 87.2 m。"

  jcas60.array:
    value: {tx_elements: [1, 2, 4, 8, 16], spacing_lambda: 0.5, element_pattern: "cos", steering: "phase", field_of_view_deg: 60, crossover_db: 3, rx_elements: 1, squint_elements: 16, simulated_elements: 8}
    unit: "-, 波长, text, text, 度, dB, -, -, -"
    source: assumed
    cite: "本库；阵列的几何与阵因子是 arraytx 的 geometry / beam（经 mmw60_trx vendor）"
    note: "里程碑 1 第一步的发射阵列（jcas60.arrays，示例 02）：均匀直线阵，间距半波长，每个单元一个与单天线时相同的 PA 与相同增益的单元天线（jcas60.antenna_gain_dbi 的发射那一项当作单元增益），单元方向图取 arraytx 的 cos；相位扫描（不是真时延）；接收仍是一根天线。视场取 ±60°，相邻波束在 −3 dB 处相交（指半功率 3.01 dB，arraytx 的波束宽度就是这个电平；波束按 sin θ 等间隔、居中摆）。squint_elements / simulated_elements：波束偏斜与波形级的那条路各在几个单元上量。换了会动什么：单元数每 ×2，满功率 EIRP +6 dB、波束窄一半、要扫的方向数 ×2；间距大于半波长在 ±60° 内出栅瓣；视场取小方向数按 sin 比例少；接收也用阵列时 SNR 再 +10·log10(N)，这里没有算。单站的泄漏：每个单元到接收天线的隔离都取单天线的那个数；相位扫描下 N 路泄漏是同一个波形，按相量相加，相位没有模型，给两个界（功率相加、全部同相），同相那个界就是表里原来的式子；隔离随单元远近变、相位随波束指向变，都没有建模，换了示例 02 §5 的每个数都动。10 dBi 的单元增益与半波长的间距并不自洽（10 dBi 的口径比半波长大），这是两头借数的结果，单元天线没有建模。"

  jcas60.rx_array:
    value: {rx_elements: [1, 2, 4, 8, 16], simulated_elements: 8, target_angle_deg: 20, angle_trials: 32, leak_frames: 4}
    unit: "-, -, 度, 帧, 帧"
    source: assumed
    cite: "本库；阵列的几何与阵因子是 arraytx 的 geometry / beam（经 mmw60_trx vendor）；单元、间距、视场沿用 jcas60.array"
    note: "里程碑 1 第二步的接收阵列（jcas60.rxarray，示例 03）：N 个接收单元各带一条与表里相同的接收链与 ADC，共用一个本振，波束在数字域合成；单元增益取表里接收天线的那个数（与 λ/2 的间距不自洽，同 jcas60.array）。simulated_elements / target_angle_deg：波形级那条路在几个单元、目标在哪个方向上量；angle_trials：测角误差统计几帧（32 帧时 rms 的统计误差约 ±13 %）；leak_frames：带泄漏的读数平均几帧。泄漏在各接收单元上的相位没有模型，用“像从哪个方向来的波”参数化，给三种情形（正在波束方向、主瓣裙上剩 1/N、第一个零点）。换了会动什么：单元数每 ×2，只收不发阵列的 SNR +3 dB（两种法规读法都是）、测角的 CRLB 约 ÷2.8；目标方向偏离正侧向，单元方向图两程按 cos⁴ 掉；各接收链不共用本振时泄漏上的相噪残余不再相干，三种情形合成一种（功率相加）。"
